<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>qcard</title>
    <script>
      // 운영 프로젝트의 Firebase 기본 주소로 들어오면 qcard.dev로 보낸다 (경로·쿼리 유지).
      // 로그인 핸들러 /__/auth/*는 Hosting 예약 경로라 이 페이지를 거치지 않는다
      if (/^qcard-d2ade\.(web\.app|firebaseapp\.com)$/.test(location.hostname)) {
        location.replace('https://qcard.dev' + location.pathname + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
